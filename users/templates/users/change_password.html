{% extends 'base.html' %}

{% block content %}
<div class="container mt-4" style="max-width: 600px;">
    <h1 class="mb-4">Смена пароля</h1>
    <form method="post">
        {% csrf_token %}   
        {% for field in form %}
      <div class="mb-3">
        {{ field.label_tag }}
        {{ field }}
        {% if field.errors %}
          <div class="text-danger">{{ field.errors }}</div>
        {% endif %}
      </div>
    {% endfor %} 
        <button type="submit" class="btn btn-success">Изменить</button>
        <a href="{% url 'users:profile' %}" class="btn btn-outline-success">Отмена</a>
    </form>
</div>
{% endblock %}
