{% extends 'base.html' %}

{% block content %}
    <div class="d-flex justify-content-between align-items-center">
        <div><h1>Мой профиль</h1></div>
        <div>
            <a href="/" class="btn btn-outline-success">На главную</a>
        </div>
    </div>
<div class="card-body card mt-3 mb-3">
    <div class="mb-3">
        <label class="form-label">Имя пользователя:</label>
        {{ user.username }}
    </div>
    <div class="mb-3">
        <label class="form-label">Фамилия:</label>
        {{ user.last_name }}
    </div>
    <div class="mb-3">
        <label class="form-label">Имя:</label>
        {{ user.first_name }}
    </div>
    <div>
    <label class="form-label">Электронная почта:</label>
        {{ user.email }}
    </div>
</div>
    <div class="card-body card">
        <a href="{% url 'users:profile_edit' %}">Редактировать профиль</a>
        <a href="{% url 'users:posts_user' %}">Мои посты</a>
        <a href="{% url 'users:comments_user' %}">Мои комменты</a>
    </div>
{% endblock %}
