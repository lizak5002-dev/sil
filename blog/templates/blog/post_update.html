{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h1 class="mb-3">Редактирование поста</h1>
    
    <form method="POST" class="form">
        {% csrf_token %}
        
        <div class="mb-3">
            <label class="form-label">Заголовок</label>
            {{ form.title }}
        </div>
        
        <div class="mb-3">
            <label class="form-label">Краткое описание</label>
            {{ form.lead }}
        </div>
        <!-- Контент -->
        <div class="mb-3">
            <label class="form-label">Содержание</label>
            {{ form.content }}
        </div>
        
        <!-- Категория -->
        <div class="mb-3">
            <label>Категория</label>
            {{ form.category }}
        </div>
        
        <!-- Изображение -->
        <div class="mb-3">
            <label>Изображение</label>
            {{ form.image }}
        </div>
        <button type="submit" class="btn btn-success" name="action" value="publish">Опубликовать</button>
        <a href="{% url 'users:posts_user' %}" class="btn btn-outline-danger">Назад</a>
    </form>
</div>
{{ form.media }}
{% endblock %}
